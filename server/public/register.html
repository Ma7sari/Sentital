<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berätta lite om dig – Sentinel</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #fff;
      --text: #2c2c2c;
      --muted: #5a5a5a;
      --green: #2d9d78;
      --border: #ddd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    .progress-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 48px;
    }
    .progress-step {
      flex: 1;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
    }
    .progress-step.active {
      background: var(--green);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }
    .form-group input::placeholder {
      color: #999;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--green);
    }
    .btn-primary {
      width: 100%;
      padding: 16px 24px;
      margin-top: 8px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-google {
      width: 100%;
      padding: 16px 24px;
      margin-top: 12px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-google:hover {
      background: #f0ece6;
      border-color: var(--muted);
    }
    .btn-google .g-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .google-hint {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 40px;
    }
    .nav-logo .icon {
      width: 36px;
      height: 36px;
      background: var(--green);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-logo .icon svg {
      width: 24px;
      height: 24px;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="/" class="nav-logo">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      SENTINEL
    </a>

    <div class="progress-bar">
      <div class="progress-step active"></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
    </div>

    <h1>Berätta lite om dig</h1>
    <p class="subtitle">Vi behöver dina kontaktuppgifter för att kunna varna dig.</p>

    <form id="register-form">
      <div class="form-group">
        <label for="name">Ditt namn</label>
        <input type="text" id="name" name="name" placeholder="Anna Andersson" required>
      </div>
      <div class="form-group">
        <label for="phone">Telefonnummer</label>
        <input type="tel" id="phone" name="phone" placeholder="070-123 45 67" required>
      </div>
      <div class="form-group">
        <label for="email">E-postadress</label>
        <input type="email" id="email" name="email" placeholder="anna@exempel.se" required>
      </div>
      <button type="submit" class="btn-primary">Fortsätt</button>
    </form>

    <button type="button" class="btn-google" id="btn-google" aria-label="Logga in med Google-konto">
      <svg class="g-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Logga in med Google-konto
    </button>
    <p class="google-hint">Välj detta om du vill koppla ditt <strong>Gmail</strong> (Google läser bara inkorgen, skickar inget). Fungerar inte OAuth just nu kan du klicka <strong>Fortsätt</strong> istället.</p>
  </div>

  <script>
    function readForm() {
      return {
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
      };
    }

    function saveRegistration(data) {
      sessionStorage.setItem('vakt_registration', JSON.stringify(data));
    }

    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const { name, phone, email } = readForm();
      if (!name || !phone || !email) return;
      saveRegistration({ name, phone, email });
      window.location.href = '/login';
    });

    document.getElementById('btn-google').addEventListener('click', () => {
      const formEl = document.getElementById('register-form');
      if (!formEl.reportValidity()) return;
      const { name, phone, email } = readForm();
      saveRegistration({ name, phone, email });
      window.location.href = '/auth/google';
    });
  </script>
</body>
</html>
